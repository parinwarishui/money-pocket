[build]
  command = "npm run build"
  publish = "dist"

# Firebase web config is public by design (it ships in the JS bundle;
# Firestore rules are what protect the data). Without this, Netlify's
# secrets scanner fails the deploy when it finds these values in dist/.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID,VITE_FIREBASE_MEASUREMENT_ID"

# Serve Firebase's sign-in pages from this site's own domain so that
# signInWithRedirect works on Safari / iOS (authDomain = this site).
[[redirects]]
  from = "/__/auth/*"
  to = "https://pingus-money-pocket.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/__/firebase/*"
  to = "https://pingus-money-pocket.firebaseapp.com/__/firebase/:splat"
  status = 200
  force = true
